<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document</title>
    <link rel="stylesheet" href="Assets/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

        <div class="calc-container">
            <div class="display" id="live-display">0</div>
            <input type="text" id="inp">

            <table class="w-100">
                <tr>
                    <td><button class="btn-neon" onclick="clr()">C</button></td>
                    <td><button class="btn-neon" onclick="del()">DEL</button></td>
                    <td colspan="2"><button class="btn-neon op-btn" onclick="str('/')">÷</button></td>
                </tr>
                <tr>
                    <td><button class="btn-neon" onclick="str('7')">7</button></td>
                    <td><button class="btn-neon" onclick="str('8')">8</button></td>
                    <td><button class="btn-neon" onclick="str('9')">9</button></td>
                    <td><button class="btn-neon op-btn" onclick="str('*')">×</button></td>
                </tr>
                <tr>
                    <td><button class="btn-neon" onclick="str('4')">4</button></td>
                    <td><button class="btn-neon" onclick="str('5')">5</button></td>
                    <td><button class="btn-neon" onclick="str('6')">6</button></td>
                    <td><button class="btn-neon op-btn" onclick="str('-')">−</button></td>
                </tr>
                <tr>
                    <td><button class="btn-neon" onclick="str('1')">1</button></td>
                    <td><button class="btn-neon" onclick="str('2')">2</button></td>
                    <td><button class="btn-neon" onclick="str('3')">3</button></td>
                    <td><button class="btn-neon op-btn" onclick="str('+')">+</button></td>
                </tr>
                <tr>
                    <td colspan="2"><button class="btn-neon zero-btn" onclick="str('0')">0</button></td>
                    <td><button class="btn-neon" onclick="str('.')">.</button></td>
                    <td><button class="btn-neon eq-btn" onclick="eql()">=</button></td>
                </tr>
            </table>
        </div>
    </body>
    <script src="Assets/script.js"></script>

</html>
